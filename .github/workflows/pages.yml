name: github-pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite canonicals and stage site
        run: |
          python3 _rewrite_origin.py
          mkdir -p /tmp/site
          tar --exclude='./.git' --exclude='./.github' --exclude='./_gen.py' --exclude='./_gen_rest.py' --exclude='./_gen_blog.py' --exclude='./_rewrite_origin.py' -cf - . | tar -C /tmp/site -xf -
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site
      - id: deployment
        uses: actions/deploy-pages@v4
